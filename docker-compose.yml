services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-business-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital-business-card
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d digital-business-card']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-business-card-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/digital-business-card
    ports:
      - '3000:3000'
    command: ['./docker-entrypoint.sh']

volumes:
  postgres_data:
